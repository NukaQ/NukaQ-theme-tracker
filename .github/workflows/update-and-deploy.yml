# 株価を取得してサイトを作り直し、GitHub Pages に公開する。
# 日本株の大引け後と、米国株の取引終了後に1日2回動く。
name: Update data and deploy

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 16:10 JST（日本株の大引け後）
    - cron: "40 21 * * 1-5"  # 06:40 JST（米国株の取引終了後。夏時間は1時間早く閉まる）
  workflow_dispatch:          # 手動で実行するボタン
  push:
    branches: [main]

permissions:
  contents: write   # AI解析の結果をリポジトリに保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 株価を取得してJSONを作る
        run: |
          pip install -r requirements.txt
          python scripts/update_data.py

      # AI解析: 前回送ったバッチの結果を受け取り、次の銘柄を送る。
      # ANTHROPIC_API_KEY（Settings → Secrets）がなければ何もしない。失敗してもサイトの更新は続ける。
      # push のときは費用がかからないよう受け取りだけにする。
      - name: AI解析
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/analyze.py collect
          if [ "${{ github.event_name }}" != "push" ]; then
            python scripts/analyze.py submit
          fi

      - name: AI解析の結果をリポジトリに保存
        continue-on-error: true
        run: |
          git add data/analysis
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AI解析の結果を更新"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: AI解析の結果をサイトに載せる
        run: python scripts/analyze.py export

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: サイトをビルド
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
