# 米国株のテーマ定義
# 階層: セクター > サブセクター > 大テーマ > テーマ > 銘柄
#
# tickers の書き方:
#   [NVDA, AMD]                 銘柄名は config/universe/us.csv（S&P500一覧）から自動で付く
#   [NVDA, {ARM: Arm}]          S&P500以外の銘柄は「ティッカー: 表示名」で書く
# 同じ銘柄を複数テーマに入れてもよい。どのテーマにも入らない銘柄も「銘柄」ページには表示される。
market: us
name: 米国株
currency: USD
benchmarks:
  SPY: S&P500 (SPY)
  QQQ: NASDAQ100 (QQQ)
# 表示名の上書き（S&P500一覧の正式名が長いもの）
