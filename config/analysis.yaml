# AI解析の設定

# 管理者がボタンを押したときに使う Claude Code（有料プラン）のモデル。
# 空にするとアカウントの既定のモデル。プランで使えるモデルを "opus" / "sonnet" などで指定できる。
claude_code_model: ""

# ---- 以下は Anthropic API（従量課金）で全銘柄を順番に解析する場合の設定（いまは使っていない）
model: claude-opus-5-5
effort: medium        # low / medium / high（高いほど丁寧だが費用が増える）

# 1回の実行で新しく解析する銘柄数の上限（GitHub Actions は1日2回動く）
max_per_run: 80
# 前回の解析からこの日数が経ったら解析し直す
refresh_days: 7
# 決算発表からこの日数以内で、まだ決算後に解析していない銘柄を最優先にする
earnings_priority_days: 4
# 解析に使うニュースの件数
news_limit: 10
